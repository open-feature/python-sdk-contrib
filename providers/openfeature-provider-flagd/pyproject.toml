[build-system]
# `uv_build` backend doesn't support build hooks yet https://github.com/astral-sh/uv/issues/14561
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfeature-provider-flagd"
version = "0.5.2"
description = "OpenFeature provider for the flagd flag evaluation engine"
readme = "README.md"
authors = [{ name = "OpenFeature", email = "openfeature-core@groups.io" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = []
dependencies = [
  "openfeature-sdk>=0.8.2",
  "openfeature-flagd-core>=1.0.0,<2",
  "grpcio>=1.82.1",
  "protobuf>=7.35.1,<8.0.0",
  "pyyaml>=6.0.1",
  "cachebox>=5.1.0,<6.0.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/open-feature/python-sdk-contrib"

[dependency-groups]
dev = [
  "asserts>=0.14.0,<0.15.0",
  "coverage[toml]>=7.10.0,<8.0.0",
  "grpcio-health-checking>=1.82.1,<2.0.0",
  "mypy>=1.18.0,<2.0.0",
  # The OpenFeature conformance suite. Ships the feature files, the flag set,
  # the control-API client and the Compose harness that owns the container
  # stack, and registers its step definitions through a pytest11 entry point --
  # so tests/tck declares a Compose file and nothing else. The `compose` extra
  # is what pulls testcontainers in for the harness.
  "openfeature-tck[compose]",
  "poethepoet>=0.37.0",
  "pytest>=9.0.0,<10.0.0",
  "pytest-bdd>=8.1.0,<9.0.0",
  "testcontainers>=4.12.0,<5.0.0",
  "types-grpcio>=1.0.0,<2.0.0",
  "types-protobuf>=7.0.0,<8.0.0",
  "types-pyyaml>=6.0.0,<7.0.0",
]

[tool.hatch.build.hooks.protobuf]
generate_pyi = false
dependencies = [
    # grpcio-tools >=1.82 requires protobuf>=7.35.1,<8.0.0
    "protobuf>=7.35.1,<8.0.0",
    "hatch-protobuf",
    "mypy-protobuf~=3.0",
    # Pin grpcio-tools to the same version as the runtime `grpcio` floor
    "grpcio-tools==1.82.1",
]
proto_paths = [
  ".",
]
output_path = "src/"

[[tool.hatch.build.hooks.protobuf.generators]]
name = "mypy"
outputs = ["{proto_path}/{proto_name}_pb2.pyi"]

[[tool.hatch.build.hooks.protobuf.generators]]
name = "mypy_grpc"
outputs = ["{proto_path}/{proto_name}_pb2_grpc.pyi"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".gitignore",
  "/openfeature",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openfeature"]

[tool.coverage.run]
omit = [
  # exclude generated files
  "src/openfeature/schemas/*",
  "tests/**",
]

[tool.mypy]
mypy_path = "src"
files = "src"

python_version = "3.10" # should be identical to the minimum supported version
namespace_packages = true
explicit_package_bases = true
local_partial_types = true # will become the new default from version 2
allow_redefinition_new = true # will become the new default from version 2
fixed_format_cache = true # new caching mechanism
pretty = true

strict = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "json_logic.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "openfeature.schemas.*"
]
warn_unused_ignores = false

[tool.uv.sources]
openfeature-flagd-core = { workspace = true }
openfeature-tck = { workspace = true }

[tool.pytest]
strict = true

[tool.poe.tasks]
# `tests/tck` is excluded from the default build on purpose, and a maintainer
# runs `poe test-tck` by hand before merging a change to it. Why a conformance
# suite is not a required gate is Appendix F, "Running the suite in CI" --
# linked from tools/openfeature-tck/README.md -- and is deliberately not
# restated here.
#
# What is local to this package: a full run is 7 failed, 87 passed, 18 skipped.
# Six of those failures are three canonical flags flagd-testbed does not seed
# yet, on each of the two resolvers, and the seventh is a real provider-side
# gap; tests/tck/conftest.py accounts for all seven. Docker is not what decides
# the exclusion -- `tests/e2e` needs Docker too and does run here.
#
# The suite is still *collected* on every default build, so it cannot quietly
# stop importing against the harness while nobody runs it. `--ignore` would
# otherwise leave nothing checking that, since mypy here is configured over
# `src` alone.
test = ["test-default", "test-tck-collect"]
test-cov = ["test-cov-default", "test-tck-collect"]
test-default = "pytest tests --ignore=tests/tck"
test-cov-default = "coverage run -m pytest tests --ignore=tests/tck"
test-tck = "pytest tests/tck"
test-tck-collect = "pytest tests/tck --collect-only -q"
cov-report = "coverage xml"
cov = [
    "test-cov",
    "cov-report"
]
mypy = "mypy"
