[build-system]
requires = ["uv_build~=0.10.0"]
build-backend = "uv_build"

[project]
name = "openfeature-provider-ofrep"
version = "0.3.0"
description = "OpenFeature provider for the OpenFeature Remote Evaluation Protocol (OFREP)"
readme = "README.md"
authors = [{ name = "OpenFeature", email = "openfeature-core@groups.io" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = []
dependencies = [
  "openfeature-sdk>=0.8.2",
  "requests>=2.27.0"
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/open-feature/python-sdk-contrib"


[dependency-groups]
dev = [
  "coverage[toml]>=7.10.0,<8.0.0",
  "mypy>=1.18.0,<2.0.0",
  # The OpenFeature conformance suite. Ships the feature files, the flag set,
  # the control-API client and the Compose harness that owns the container
  # stack, and registers its step definitions through a pytest11 entry point --
  # so tests/tck declares a Compose file and nothing else. The `compose` extra
  # is what pulls testcontainers in for the harness.
  "openfeature-tck[compose]",
  "poethepoet>=0.37.0",
  "pytest>=9.0.0,<10.0.0",
  "pytest-bdd>=8.1.0,<9.0.0",
  "requests-mock>=1.12.0,<2.0.0",
  "types-requests>=2.32.0,<3.0.0",
]

[tool.uv.sources]
openfeature-tck = { workspace = true }

[tool.uv.build-backend]
module-name = "openfeature"
module-root = "src"
namespace = true
source-exclude = [
  # `openfeature-sdk` already includes the `py.typed` file,
  # but it is necessary for local type checking of `flipt`
  "openfeature/py.typed"
]

[tool.coverage.run]
omit = [
  "tests/**",
]

[tool.mypy]
mypy_path = "src"
files = "src"

python_version = "3.10" # should be identical to the minimum supported version
namespace_packages = true
explicit_package_bases = true
local_partial_types = true # will become the new default from version 2
allow_redefinition_new = true # will become the new default from version 2
fixed_format_cache = true # new caching mechanism
pretty = true

strict = true
disallow_any_generics = false

[tool.pytest]
strict = true

[tool.poe.tasks]
# `tests/tck` is excluded from the default build on purpose, and a maintainer
# runs `poe test-tck` by hand before merging a change to it. It needs Docker,
# and more to the point a conformance suite reports what is true of the *stack*
# under test: two of its failures today are canonical flags flagd-testbed does
# not seed yet, which are the report rather than something to hide. A gate that
# has to be green cannot hold a suite whose honest output is red. See
# tests/tck/conftest.py for the tally, and the TCK's README for the policy.
test = "pytest tests --ignore=tests/tck"
test-cov = "coverage run -m pytest tests --ignore=tests/tck"
test-tck = "pytest tests/tck"
cov-report = "coverage xml"
cov = [
    "test-cov",
    "cov-report"
]
mypy = "mypy"
