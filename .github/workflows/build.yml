# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: "Build, lint, and test"

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      # Temporary, for the duration of the provider conformance suite's review.
      # Without it a stacked pull request gets no CI at all: this filter matches
      # the pull request's BASE branch, so only the suite PR itself -- the one
      # targeting main -- was ever checked, and the report and adoption PRs
      # stacked on it were merged-in-theory and tested never. Remove once the
      # chain has landed. See open-feature/spec#417.
      - 'feat/provider-tck*'

permissions:
  contents: read

env:
  TARGET_PYTHON_VERSION: "3.14"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # needed for `dorny/paths-filter`
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            hooks/openfeature-hooks-opentelemetry:
              - 'hooks/openfeature-hooks-opentelemetry/**'
              - 'uv.lock'
            providers/openfeature-provider-aws-ssm:
              - 'providers/openfeature-provider-aws-ssm/**'
              - 'uv.lock'
            providers/openfeature-provider-env-var:
              - 'providers/openfeature-provider-env-var/**'
              - 'uv.lock'
            providers/openfeature-provider-flagd:
              - 'providers/openfeature-provider-flagd/**'
              - 'uv.lock'
            providers/openfeature-provider-flipt:
              - 'providers/openfeature-provider-flipt/**'
              - 'uv.lock'
            providers/openfeature-provider-ofrep:
              - 'providers/openfeature-provider-ofrep/**'
              - 'uv.lock'
            providers/openfeature-provider-unleash:
              - 'providers/openfeature-provider-unleash/**'
              - 'uv.lock'
            tools/openfeature-flagd-api:
              - 'tools/openfeature-flagd-api/**'
              - 'uv.lock'
            tools/openfeature-flagd-core:
              - 'tools/openfeature-flagd-core/**'
              - 'uv.lock'
            tools/openfeature-flagd-api-testkit:
              - 'tools/openfeature-flagd-api-testkit/**'
              - 'uv.lock'
            tools/openfeature-tck:
              - 'tools/openfeature-tck/**'
              - 'uv.lock'

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      # A matrix of every supported Python against every changed package exists
      # to say *which* combinations fail. The default `fail-fast: true` discards
      # exactly that: the first failing cell cancels every other one, so a run
      # that could have reported thirty results reports one, and an unrelated
      # package's failure is indistinguishable from your own.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Install uv and set the python version ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: uv sync --frozen

      - name: Building first to generate files
        working-directory: ${{ matrix.package }}
        run: uv build

      - name: Type checking
        if: matrix.python-version == env.TARGET_PYTHON_VERSION
        working-directory: ${{ matrix.package }}
        run: poe mypy

      - name: Test with pytest
        working-directory: ${{ matrix.package }}
        run: poe cov

      - if: matrix.python-version == env.TARGET_PYTHON_VERSION
        name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          name: Code Coverage for ${{ matrix.package }} on Python ${{ matrix.python-version }}
          directory: ${{ matrix.package }}
          fail_ci_if_error: true # optional (default = false)
          verbose: true # optional (default = false)
          token: ${{ secrets.CODECOV_UPLOAD_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ env.TARGET_PYTHON_VERSION }}
          enable-cache: false # caching is done automatically in `pre-commit/action`

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  sast:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
